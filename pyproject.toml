[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lamina-consult-network"
version = "0.1.0"
description = "Synthetic specialty-care orchestration demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.34,<1",
  # Production foundation (run 2): Postgres, versioned migrations, AWS (S3, Bedrock).
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  # 2.0.x: its compiled extensions are optional (2.1's are required, and some managed Windows
  # machines block them by Application Control policy).
  "sqlalchemy>=2.0.30,<2.1",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  # Local AWS mock for the S3/Bedrock tests (never real AWS).
  "moto[s3]>=5,<6",
  # Dev-only direct Anthropic API provider and the provider eval (never installed by the deployment).
  "anthropic>=1,<2",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Shared pytest fixtures imported from another test module look like redefinitions.
"tests/test_pilot_agent.py" = ["F811"]
"tests/test_pilot_step16.py" = ["F811"]
"tests/test_pilot_step17.py" = ["F811"]
"tests/test_pilot_signoff.py" = ["F811"]
"tests/test_pilot_rule_authors.py" = ["F811"]
"tests/test_pilot_followup.py" = ["F811"]
"tests/test_pilot_activation.py" = ["F811"]
"tests/test_pilot_accounts.py" = ["F811"]
"tests/test_pilot_multi_physician.py" = ["F811"]
"tests/test_document_storage.py" = ["F811"]
"tests/test_database_postgres.py" = ["F811"]
