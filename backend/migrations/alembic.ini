# Pilot database migrations (Postgres). The URL comes only from LAMINA_DATABASE_URL (never a file).
#   alembic -c backend/migrations/alembic.ini upgrade head
[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
