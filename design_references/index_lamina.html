let profileName='Dr. Lucy Saru',profileEmail='lucy.saru@example.com'; let trained=8,question=0,selected='',answers=[],search='';const questions=[{title:'What matters most when you refer a patient?',description:'Help your agent understand how you weigh the options.',options:['Specialist expertise for the patient’s needs','Earliest available appointment','Continuity with specialists I already know']},{title:'How far should your agent look first?',description:'Set a starting point for your specialist searches.',options:['Within 10 miles of the patient','Within 25 miles of the patient','Anywhere nearby, with telehealth options']},{title:'How would you like referral options presented?',description:'Your agent can organize results around your workflow.',options:['One best match, with a clear explanation','A short list of 2–3 specialists','A broader list for me to compare']}];

function status(p){return p.status==='ready'||p.status==='review'?'<span class="badge"><span class="dot"></span>Specialist found</span>':p.status==='needed'?'<span class="badge amber">◷ &nbsp; Next step needed</span>':p.status==='searching'?'<span class="badge pulse">◌ &nbsp; Consulting network</span>':p.status==='referred'?'<span class="badge">✓ &nbsp; Referral selected</span>':'<span class="badge gray">✓ &nbsp; Up to date</span>'}
function row(p,full=false){return `<div class="patient-row"><div class="patient-name"><span class="avatar">${p.initials}</span><div><strong>${p.name}</strong><small>${full?p.date:p.age+' years · '+p.specialty}</small></div></div><div class="state">${status(p)}<div class="row-note">${p.concern}</div></div><div class="next">${p.next}</div><a class="row-action" href="#patient/${p.id}">View patient info <span>↗</span></a></div>`}
function table(list,full=false){return `<div class="card"><div class="patient-row table-head"><span>Patient${full?' / Last activity':''}</span><span>Care status</span><span class="next" style="font-size:9px">Next step</span><span></span></div>${list.map(p=>row(p,full)).join('')||'<div class="empty">No patients found. Try a different name.</div>'}</div>`}
function trainingCard(){return `<div class="train-card"><span class="eyebrow" style="font-size:9px;color:#9c7655">A little input. More thoughtful care.</span><h3>${trained>=11?'Your agent knows you better.':'Make your agent more like you.'}</h3><p>${trained>=11?'Your referral preferences are up to date. Come back anytime to refine how your agent works.':'A few quick answers help your agent find specialists that fit the way you practice.'}</p><div class="progress-row"><span>Your practice preferences</span><span>${trained} of 12 answered</span></div><div class="progress"><span style="width:${trained/12*100}%"></span></div><button class="btn primary" onclick="startTraining()">${trained>=11?'Refine your preferences':'Answer 3 quick questions'} <span>→</span></button><span class="tiny" style="margin-left:10px">~1 min</span></div>`}
function dashboard(){return `<div class="heading"><div><div class="eyebrow" style="margin-bottom:12px">Your care, moving forward</div><h1>Good morning, Dr. Saru.</h1><p class="sub">A clearer view of your patients. An agent that gets to know you.</p></div><span class="date">Wednesday, October 7</span></div><section class="hero"><div class="hero-main"><div class="orb" aria-hidden="true"></div><div class="status"><span class="dot"></span>Your agent is active</div><h2>A little more you.<br>A lot more helpful.</h2><p>Your agent is keeping care moving.<br>Keep teaching it what matters to your practice.</p><div class="hero-foot">✧ <span>${patients.filter(p=>['ready','review'].includes(p.status)).length} specialist matches ready for you to review</span></div></div>${trainingCard()}</section><div class="stats"><div class="stat"><span class="stat-icon">♧</span><div><span class="stat-value">6</span><div class="stat-label">Patients in your care</div></div></div><div class="stat"><span class="stat-icon">↗</span><div><span class="stat-value">${patients.filter(p=>['ready','review'].includes(p.status)).length}</span><div class="stat-label">Specialist matches ready</div></div></div><div class="stat"><span class="stat-icon">◷</span><div><span class="stat-value">${patients.filter(p=>p.status==='needed').length}</span><div class="stat-label">Patients with a next step</div></div></div></div><section><div class="section-head"><div><h2>Patients to keep an eye on</h2><p class="sub">Recent activity and the next step in their care.</p></div><a class="link" href="#patients">View all patients &nbsp; →</a></div>${table(patients.slice(0,3))}</section><p class="bottom-note">✧ Your agent finds the options. You guide the care.</p>`}
function patientList(){return `<div class="heading"><div><div class="eyebrow" style="margin-bottom:12px">Your practice</div><h1>Patients</h1><p class="sub">Every patient, their history, and what comes next.</p></div><span class="count">6 patients</span></div><div class="toolbar"><label class="search"><span>⌕</span><input id="patient-search" placeholder="Search patients by name…" aria-label="Search patients" oninput="filterPatients(this.value)"></label><span class="count">↓ &nbsp; Most recent activity first</span></div><div id="patient-table">${table(patients,true)}</div><p class="bottom-note">Showing patients from most to least recent activity.</p>`}
function filterPatients(q){search=q;document.getElementById('patient-table').innerHTML=table(patients.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())),true)}
function specialist(p){return `<div class="specialist"><div class="match">✧ Matched by your agent · Illustrative result</div><h4>${p.specialty==='Orthopedics'?'Dr. Sarah Patel':p.specialty==='Cardiology'?'Dr. Daniel Brooks':p.specialty==='Dermatology'?'Dr. Maya Reed':'Dr. Alex Morgan'}</h4><p>${p.specialty} · Lamina demo network<br>3.2 miles away · Next availability: Oct 14</p><p style="margin-top:10px">Matches the requested specialty and your preference for nearby care.</p><button class="btn primary" onclick="selectReferral(${p.id})">Select specialist <span>→</span></button></div>`}
function detail(p){return `<a class="back" href="#patients">← &nbsp; Back to patients</a><div class="heading"><div class="patient-title"><span class="avatar">${p.initials}</span><div><h1>${p.name}</h1><p class="sub">Patient overview · Last activity ${p.date}</p></div></div>${status(p)}</div><div class="card facts"><div class="fact"><span>Age</span><b>${p.age} years</b></div><div class="fact"><span>Patient ID</span><b>LM-00${p.id}24</b></div><div class="fact"><span>Primary clinician</span><b>Dr. Lucy Saru</b></div><div class="fact"><span>Care focus</span><b>${p.specialty}</b></div></div><div class="detail-grid"><section class="card padded"><h2>Patient history</h2><p class="sub">The story so far, all in one place.</p><div class="timeline">${['ready','review','referred'].includes(p.status)?`<div class="event"><time>${p.date}</time><h4>${p.status==='referred'?'Specialist selected':'Agent returned a specialist match'}</h4><p>${p.status==='referred'?'Your selected specialist has been added to this demo care plan. No referral has been sent.':'The agent consulted the network and found a specialist for your review.'}</p></div>`:''}<div class="event"><time>${p.date}</time><h4>${p.concern}</h4><p>${p.history}</p></div><div class="event"><time>Sep 24, 2026</time><h4>Primary care visit</h4><p>Patient history reviewed and concerns documented by Dr. Lucy Saru.</p></div><div class="event"><time>Sep 10, 2026</time><h4>Patient added to your practice</h4><p>Initial intake completed. Care preferences and prior visit summaries recorded.</p></div></div></section><section class="card padded"><h2>Next steps</h2><p class="sub">Your agent helps with the follow-through.</p>${p.status==='done'?'<div class="step"><span class="badge gray">✓ All caught up</span><h4>No next steps right now.</h4><p>This patient’s care plan is up to date.</p></div>':p.status==='referred'?'<div class="step"><span class="badge">✓ Specialist selected</span><h4>Ready for your care team</h4><p>The specialist is saved to this preview. In the full app, your team would coordinate the referral here.</p></div>':p.status==='searching'?'<div class="step" role="status"><span class="badge pulse">✧ Consulting the network</span><h4>Your agent is finding a match.</h4><p>Comparing specialty, location, and your practice preferences…</p></div>':p.status==='needed'?`<div class="step"><span class="badge amber">Referral needed</span><h4>Find a ${p.specialty.toLowerCase()} specialist</h4><p>Let your agent consult the network and bring back options that fit this patient’s needs.</p><button class="btn primary" onclick="findSpecialist(${p.id})">Find specialist <span>✧</span></button></div>`:`<div class="step"><span class="badge">✓ Your agent got back to you</span><h4>A specialist is ready for your review.</h4><p>Review the match below, then choose how to move care forward.</p></div>${specialist(p)}`}<p class="bottom-note">Simulated workflow · No referral is sent</p></section></div>`}
function agent(){return `<div class="heading"><div><div class="eyebrow" style="margin-bottom:12px">Your physician agent</div><h1>A partner that learns your practice.</h1><p class="sub">Teach your agent how you work, one conversation at a time.</p></div></div><section class="hero"><div class="hero-main"><div class="orb"></div><div class="status"><span class="dot"></span>Active · Primary care</div><h2>Dr. Saru’s Agent</h2><p>Ready to find specialist options, keep track of next steps, and learn your preferences.</p><div class="hero-foot">✧ Guided by you, built around your practice.</div></div>${trainingCard()}</section><div class="card padded"><h2>What your agent knows</h2><p class="sub">A starting point for more useful specialist matches.</p><div class="setting"><div><b>Your role</b><p>Primary care physician</p></div><span class="badge">Learned</span></div><div class="setting"><div><b>Care approach</b><p>Bring back clear options for clinician review</p></div><span class="badge">Learned</span></div>${answers.map((a,i)=>`<div class="setting"><div><b>${questions[i].title}</b><p>${escapeHtml(a)}</p></div><span class="badge">Just learned</span></div>`).join('')}<div class="setting"><div><b>Referral preferences</b><p>${answers.length?'Updated with your most recent answers':'Help your agent understand what you prioritize'}</p></div><button class="link" onclick="startTraining()">${answers.length?'Refine answers':'Teach your agent'} →</button></div></div>`}
function settings(){return `<div class="heading"><div><div class="eyebrow" style="margin-bottom:12px">Your account</div><h1>User settings</h1><p class="sub">Manage your profile, notifications, and account security.</p></div></div><div class="settings"><section class="card padded"><h2>Profile</h2><label class="setting"><b>Full name</b><input id="profile-name" value="${escapeHtml(profileName)}"></label><label class="setting"><b>Email address</b><input type="email" id="profile-email" value="${escapeHtml(profileEmail)}"></label><button class="btn primary" onclick="saveProfile()">Save changes</button></section><section class="card padded" style="margin-top:20px"><h2>Notifications</h2><div class="setting"><div><b>Specialist matches</b><p>Know when your agent has a match ready to review.</p></div><button class="toggle on" role="switch" aria-label="Specialist match notifications" aria-checked="true" onclick="toggle(this)"></button></div><div class="setting"><div><b>Patient next steps</b><p>A reminder when a patient needs your attention.</p></div><button class="toggle on" role="switch" aria-label="Patient next step notifications" aria-checked="true" onclick="toggle(this)"></button></div></section><section class="card padded" style="margin-top:20px"><h2>Security</h2><div class="setting"><div><b>Password</b><p>Keep your account protected.</p></div><button class="btn" onclick="securityModal()">Change password</button></div><div class="setting"><div><b>Two-factor authentication</b><p>Add an extra layer of account protection.</p></div><button class="btn" onclick="toast('Preview only — two-factor setup would begin here.')">Set up</button></div></section><p class="bottom-note">Settings are illustrative and do not change a real account.</p></div>`}
function render(){const route=location.hash.slice(1)||'dashboard';document.getElementById('nav-dashboard').classList.toggle('active',route==='dashboard');document.getElementById('nav-patients').classList.toggle('active',route==='patients'||route.startsWith('patient/'));const label=route.startsWith('patient/')?'Patients / Patient info':({dashboard:'Dashboard',patients:'Patients',agent:'My Agent',settings:'User settings'}[route]||'Dashboard');document.getElementById('crumb').textContent='Your workspace / '+label;const p=patients.find(p=>p.id===Number(route.split('/')[1]));document.getElementById('main').innerHTML=route==='patients'?patientList():route==='settings'?settings():route==='agent'?agent():p?detail(p):dashboard()}
function findSpecialist(id){const p=patients.find(p=>p.id===id);p.status='searching';render();setTimeout(()=>{p.status='ready';p.next='Review the specialist your agent found';render();toast('Your agent found a specialist. Review the demo match.');},1800)}
function selectReferral(id){const p=patients.find(p=>p.id===id);p.status='referred';p.next='Coordinate referral with your care team';render();toast('Specialist selected in preview. No referral has been sent.')}
function toggle(el){el.classList.toggle('on');el.setAttribute('aria-checked',el.classList.contains('on'));toast('Notification preference updated in this preview.')}
let previousFocus;function showModal(html){previousFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</section></div>`;document.querySelector('.modal button')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML='';previousFocus?.focus()}
function startTraining(){question=0;selected='';trainingQuestion()}
function trainingQuestion(){let q=questions[question];showModal(`<div class="modal-top"><span class="eyebrow">✧ Teach your agent</span><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div><div class="progress-row"><span>Practice preferences</span><span>Question ${question+1} of 3</span></div><div class="progress"><span style="width:${(question+1)/3*100}%"></span></div><h2 id="modal-title">${q.title}</h2><p class="sub">${q.description}</p><div class="choices">${q.options.map((o,i)=>`<button class="choice" aria-pressed="false" onclick="pickAnswer(${i},this)">${o}</button>`).join('')}</div><div class="modal-footer"><span class="tiny">You can refine these anytime.</span><button class="btn primary" id="next-question" disabled onclick="nextQuestion()">${question===2?'Save preferences':'Continue'} →</button></div>`)}
function pickAnswer(i,el){selected=questions[question].options[i];document.querySelectorAll('.choice').forEach(e=>{e.classList.remove('selected');e.setAttribute('aria-pressed','false')});el.classList.add('selected');el.setAttribute('aria-pressed','true');document.getElementById('next-question').disabled=false}
function nextQuestion(){answers[question]=selected;if(question<2){question++;selected='';trainingQuestion()}else{trained=11;render();showModal(`<div class="modal-top"><span class="eyebrow">✧ Preferences saved</span><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div><div class="success-orb">✧</div><h2 id="modal-title">A little more like you.</h2><p class="sub">Your agent now has a clearer picture of what matters to your practice. Your answers are now visible in My Agent. In the full app, they would guide future specialist matches.</p><div class="step"><span class="badge">3 new preferences learned</span><p style="margin:14px 0 0">${answers.map(escapeHtml).join('<br>')}</p></div><div class="modal-footer"><span class="tiny">11 of 12 preferences complete</span><button class="btn primary" onclick="closeModal()">Back to workspace →</button></div>`)}}
function saveProfile(){profileName=document.getElementById('profile-name').value;profileEmail=document.getElementById('profile-email').value;toast('Profile changes saved in this preview only.')}
function securityModal(){showModal(`<div class="modal-top"><span class="eyebrow">Account security</span><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div><h2 id="modal-title">Change your password</h2><p class="sub">In the connected app, a secure password reset link would be sent to your account email.</p><div class="step"><p style="margin:0">This is a visual preview. No email is sent and no account credentials are changed.</p></div><div class="modal-footer"><span></span><button class="btn primary" onclick="closeModal();toast('Demo reset link requested. No email was sent.')">Preview reset request →</button></div>`) }
let toastTimer;function toast(msg){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',4500)}
document.addEventListener('keydown',e=>{const modal=document.querySelector('.modal');if(!modal)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const items=[...modal.querySelectorAll('button:not(:disabled),input,a')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0)});render();
</script></body></html>
